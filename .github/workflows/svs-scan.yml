name: SVS Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required for SARIF upload to Code Scanning

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scanner tools
        run: |
          pip install semgrep==1.177.0 pip-audit==2.9.0 checkov==3.2.431
          # Install Gitleaks
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin
          # Install Trivy (optional)
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin || true

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run SVS scan
        continue-on-error: true
        env:
          UPLOAD_DIR: /tmp/svs_uploads
          DATABASE_URL: sqlite:////tmp/svs.db
        run: |
          cd backend
          python -c "
          import os, sys, json
          sys.path.insert(0, '.')
          from app.engine.scanner import ScannerService
          from app.models.base import Base
          from app.database import engine, SessionLocal
          from app.models.scan import Scan
          from app.models.project import Project
          from app.models.user import User
          Base.metadata.create_all(bind=engine)
          db = SessionLocal()
          user = User(username='ci', email='ci@svs.local', hashed_password='!')
          db.add(user); db.commit(); db.refresh(user)
          project = Project(name='CI Scan', repo_url='local', owner_id=user.id)
          db.add(project); db.commit(); db.refresh(project)
          scan = Scan(project_id=project.id, status='PENDING')
          db.add(scan); db.commit(); db.refresh(scan)
          src = os.path.abspath('..')
          dst = f'/tmp/svs_uploads/scan_{scan.id}'
          os.makedirs(dst, exist_ok=True)
          import shutil
          # Copy the repo (skip heavy dirs)
          for item in os.listdir(src):
              if item in {'.git', 'node_modules', '.venv', '__pycache__', 'dist', 'build', '.tox'}:
                  continue
              s = os.path.join(src, item)
              d = os.path.join(dst, item)
              if os.path.isdir(s):
                  shutil.copytree(s, d, dirs_exist_ok=True)
              else:
                  shutil.copy2(s, d)
          svc = ScannerService()
          svc.run_full_scan(scan.id, dst, db)
          print(f'Scan {scan.id}: {scan.status} score={scan.score} findings={len(scan.findings)}')
          if scan.error_detail:
              print(f'Warnings: {scan.error_detail}')
          # Generate SARIF
          sarif = {
              '\$schema': 'https://docs.oasis-open.org/sarif/sarif/v2.1.0/cs01/schemas/sarif-schema-2.1.0.json',
              'version': '2.1.0',
              'runs': [{
                  'tool': {'driver': {'name': 'SVS', 'rules': [
                      {'id': (f.cwe or f.vulnerability_type), 'name': (f.cwe or f.vulnerability_type)}
                      for f in { (f.cwe or f.vulnerability_type) for f in scan.findings }
                  ]}},
                  'results': [
                      {
                          'ruleId': f.cwe or f.vulnerability_type,
                          'level': {'CRITICAL': 'error', 'HIGH': 'error', 'MEDIUM': 'warning', 'LOW': 'note'}.get(f.severity, 'warning'),
                          'message': {'text': f.description},
                          'locations': [{'physicalLocation': {'artifactLocation': {'uri': f.file_path}, 'region': {'startLine': max(f.line_number or 0, 1)}}}],
                      }
                      for f in scan.findings
                  ],
              }],
          }
          with open('/tmp/scan_report.sarif', 'w') as f:
              json.dump(sarif, f, indent=2)
          print(f'SARIF written with {len(scan.findings)} results')
          db.close()
          "

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/scan_report.sarif
          category: svs-security-scan
        continue-on-error: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '## SVS Security Scan\n\nScan complete. See the **Security** tab for full findings.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });