server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed, so a missing one is a stale cached
    # reference, not a route. Serve a real 404, not index.html: returning
    # HTML for a .js URL makes the browser run HTML as JavaScript and the
    # whole app fails to boot with a syntax error.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router owns every path, so unknown URLs must
    # still resolve to index.html instead of nginx's own 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
